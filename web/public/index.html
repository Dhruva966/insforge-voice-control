<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsForge Voice Control — Live Dashboard</title>
  <meta name="description" content="Real-time voice-controlled infrastructure dashboard for InsForge." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg-primary: #050508;
      --bg-secondary: #0a0a10;
      --bg-card: rgba(20, 20, 30, 0.6);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --border-default: rgba(255, 255, 255, 0.1);
      --border-active: rgba(99, 102, 241, 0.5);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.2);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --error: #ef4444;
      --warning: #f59e0b;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background effect */
    .ambient-bg {
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
                  radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 30%);
      animation: ambientDrift 20s ease-in-out infinite alternate;
      z-index: 0; pointer-events: none;
    }

    @keyframes ambientDrift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-5%, 5%); }
    }

    /* Header */
    .header {
      padding: 16px 24px;
      background: rgba(10, 10, 16, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    .logo-container {
      display: flex; align-items: center; gap: 12px;
    }

    /* Agent Orb Visualizer */
    .agent-orb {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #818cf8, var(--accent));
      box-shadow: 0 0 15px var(--accent-glow), inset -2px -2px 6px rgba(0,0,0,0.4);
      transition: all 0.5s ease;
    }
    
    .agent-orb.waiting {
      background: radial-gradient(circle at 30% 30%, #52525b, #27272a);
      box-shadow: none;
      animation: breathe 4s infinite ease-in-out;
    }
    
    .agent-orb.active {
      animation: pulseActive 2s infinite ease-out, glow 1.5s infinite alternate;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    
    @keyframes pulseActive {
      0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }

    .header-title { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
    
    .status-badge {
      margin-left: auto;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px; font-weight: 500;
      border: 1px solid var(--border-subtle);
      background: rgba(255,255,255,0.03);
      transition: var(--transition);
      display: flex; align-items: center; gap: 8px;
    }
    
    .status-badge.active {
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--success-glow);
      color: var(--success);
    }

    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    /* Sidebar */
    .sidebar {
      background: rgba(10, 10, 16, 0.5);
      border-right: 1px solid var(--border-subtle);
      backdrop-filter: blur(20px);
      display: flex; flex-direction: column;
    }

    .panel {
      padding: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .panel-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-tertiary);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }

    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: 8px; padding: 12px;
      transition: var(--transition);
    }
    .stat-box:hover { border-color: var(--border-active); }
    
    .stat-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; }

    /* Operations Stream */
    .stream-container {
      flex: 1; overflow-y: auto; padding: 0 20px 20px;
    }
    
    .stream-container::-webkit-scrollbar { width: 4px; }
    .stream-container::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 2px; }

    .op-card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: 8px; padding: 12px; margin-top: 12px;
      transform-origin: top;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0; transform: translateY(10px) scale(0.95);
    }

    @keyframes popIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .op-card.executing { border-color: var(--warning); box-shadow: 0 0 10px rgba(245, 158, 11, 0.1); }
    .op-card.success { border-color: var(--success); }
    .op-card.failure { border-color: var(--error); }

    .op-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    
    .op-title { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .op-time { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-tertiary); }
    .op-detail { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Main Area */
    .main-area { display: flex; flex-direction: column; }
    
    /* IDE Viewer */
    .ide-container {
      flex: 1; display: flex; flex-direction: column;
      background: var(--bg-primary);
    }
    
    .ide-tabs {
      display: flex; padding: 0 16px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-subtle);
    }
    
    .ide-tab {
      padding: 12px 20px; font-size: 12px; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: var(--transition);
      font-family: 'JetBrains Mono', monospace;
    }
    .ide-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .code-window {
      flex: 1; padding: 24px; overflow: auto;
      font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6;
    }
    
    .code-window::-webkit-scrollbar { width: 6px; height: 6px; }
    .code-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .code-animate {
      animation: typeFade 0.5s ease-out forwards;
    }
    
    @keyframes typeFade {
      0% { opacity: 0; transform: translateY(5px); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* Floating Transcript */
    .transcript-overlay {
      position: absolute; bottom: 24px; left: 364px; right: 24px;
      pointer-events: none; display: flex; flex-direction: column; gap: 12px;
      justify-content: flex-end; align-items: center;
    }

    .t-bubble {
      max-width: 80%; padding: 12px 20px; border-radius: 12px;
      font-size: 14px; line-height: 1.5; pointer-events: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: slideUpFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0; transform: translateY(20px);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(10px);
    }

    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }

    .t-bubble.user { background: rgba(30, 30, 40, 0.85); color: #fff; border-bottom-left-radius: 4px; align-self: flex-start; }
    .t-bubble.agent { background: rgba(67, 56, 202, 0.2); border-color: rgba(99, 102, 241, 0.3); color: #e0e7ff; border-bottom-right-radius: 4px; align-self: flex-end; }
    
    .t-role { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.6; margin-bottom: 4px; display: block; font-weight: 600; }

    /* Initial State Blank */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; opacity: 0.5;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; animation: float 6s ease-in-out infinite; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  
  <header class="header">
    <div class="logo-container">
      <div class="agent-orb waiting" id="main-orb"></div>
      <div class="header-title">Snoopy.ai <span style="font-weight:400; color:var(--text-tertiary)">| Core Infrastructure</span></div>
    </div>
    <div class="status-badge" id="top-status">
      <div class="status-dot" style="width:6px;height:6px;border-radius:50%;background:currentColor"></div>
      <span id="status-text">Awaiting Connect</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">Session Telemetry</div>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-label">Connection</div>
            <div class="stat-val" id="val-sid" style="color:var(--text-secondary)">—</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Duration</div>
            <div class="stat-val" id="val-time">00:00</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Total Actions</div>
            <div class="stat-val" id="val-actions">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Latency</div>
            <div class="stat-val" id="val-ping" style="color:var(--success)">~45ms</div>
          </div>
        </div>
      </div>

      <div class="panel" style="flex:1; display:flex; flex-direction:column; padding-bottom:0">
        <div class="panel-title">Operations Stream</div>
      </div>
      <div class="stream-container" id="ops-stream">
        <!-- Cards injected here -->
      </div>
    </aside>

    <main class="main-area">
      <div class="ide-container">
        <div class="ide-tabs">
          <div class="ide-tab active" id="tab-name">terminal.sh</div>
        </div>
        <div class="code-window" id="code-viewer">
          <div class="empty-state">
            <div class="empty-icon">⌘</div>
            <div style="font-size: 16px; color: var(--text-secondary)">Call +1 (925) 515-5725</div>
            <div style="font-size: 13px; color: var(--text-tertiary); margin-top: 8px">Voice commands will compile to SQL/Code here</div>
          </div>
        </div>
      </div>
    </main>

    <div class="transcript-overlay" id="transcript-overlay">
      <!-- Bubbles injected here -->
    </div>
  </div>

  <script>
    const SSE_URL = "/api/events";
    let callStartTime = null;
    let actionCount = 0;
    let timerInterval = null;
    let activeCardId = null;

    // Utility to format time
    const formatTime = (ms) => {
      const s = Math.round(ms / 1000);
      const m = Math.floor(s / 60);
      return `${m}:${String(s % 60).padStart(2, '0')}`;
    };

    const updateTimer = () => {
      if (!callStartTime) return;
      document.getElementById('val-time').textContent = formatTime(Date.now() - callStartTime);
    };

    const orb = document.getElementById('main-orb');
    const badge = document.getElementById('top-status');
    const btext = document.getElementById('status-text');

    const setState = (state) => {
      orb.className = `agent-orb ${state}`;
      badge.className = `status-badge ${state}`;
      if (state === 'active') {
        btext.textContent = 'Live Session';
        document.getElementById('val-ping').textContent = Math.floor(Math.random() * 40 + 30) + 'ms';
      } else {
        btext.textContent = state === 'ended' ? 'Session Terminated' : 'Awaiting Connect';
        document.getElementById('val-ping').textContent = '—';
      }
    };

    const createOpCard = (id, action, params) => {
      const stream = document.getElementById('ops-stream');
      const card = document.createElement('div');
      card.className = 'op-card executing';
      card.id = `op-${id}`;
      
      const titleStr = action.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      
      card.innerHTML = `
        <div class="op-header">
          <div class="op-title"><span style="color:var(--warning)">⚡</span> ${titleStr}</div>
          <div class="op-time">running...</div>
        </div>
        <div class="op-detail">${JSON.stringify(params || {}).substring(0, 40)}...</div>
      `;
      stream.prepend(card);
      return card;
    };

    const finishOpCard = (id, success, duration) => {
      const card = document.getElementById(`op-${id}`);
      if (!card) return;
      card.className = `op-card ${success ? 'success' : 'failure'}`;
      card.querySelector('.op-title span').textContent = success ? '✓' : '✗';
      card.querySelector('.op-title span').style.color = success ? 'var(--success)' : 'var(--error)';
      card.querySelector('.op-time').textContent = duration ? `${duration}ms` : 'done';
    };

    const renderCode = (code, lang, filename) => {
      const viewer = document.getElementById('code-viewer');
      document.getElementById('tab-name').textContent = filename;
      
      const pre = document.createElement('pre');
      pre.className = 'code-animate';
      const codeEl = document.createElement('code');
      codeEl.className = `language-${lang}`;
      codeEl.textContent = code;
      pre.appendChild(codeEl);
      
      viewer.innerHTML = '';
      viewer.appendChild(pre);
      hljs.highlightElement(codeEl);
    };

    const addTranscript = (role, text) => {
      const overlay = document.getElementById('transcript-overlay');
      const bubble = document.createElement('div');
      bubble.className = `t-bubble ${role}`;
      bubble.innerHTML = `<span class="t-role">${role}</span>${text}`;
      
      overlay.appendChild(bubble);
      
      // Auto-remove old bubbles to keep it clean (max 4)
      if (overlay.children.length > 4) {
        overlay.removeChild(overlay.firstChild);
      }
      
      // Fade out bubble after 6 seconds
      setTimeout(() => {
        if (overlay.contains(bubble)) {
          bubble.style.transition = 'opacity 1s ease';
          bubble.style.opacity = '0';
          setTimeout(() => {
            if (overlay.contains(bubble)) overlay.removeChild(bubble);
          }, 1000);
        }
      }, 6000);
    };

    function handleEvent(e) {
      switch (e.type) {
        case "call_started":
          callStartTime = Date.now();
          actionCount = 0;
          setState("active");
          document.getElementById('val-sid').textContent = e.callSid.substring(0, 8) + '...';
          document.getElementById('val-actions').textContent = '0';
          document.getElementById('ops-stream').innerHTML = '';
          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(updateTimer, 1000);
          renderCode("-- Connection established.\n-- System ready for instructions.", "sql", "session.log");
          break;

        case "transcript":
          addTranscript(e.role, e.text);
          // Make orb react to speech
          if (e.role === 'agent') {
            orb.style.transform = 'scale(1.2)';
            setTimeout(() => orb.style.transform = '', 300);
          }
          break;

        case "action_proposed":
          activeCardId = Date.now();
          createOpCard(activeCardId, e.action, e.params);
          const lang = (e.action === "run_sql" || e.action === "add_index") ? "sql" : "typescript";
          const file = e.action === "run_sql" ? "query.sql" : "script.ts";
          renderCode(e.diff || JSON.stringify(e.params, null, 2), lang, file);
          break;

        case "action_executing":
          // visual only
          break;

        case "action_done":
          actionCount++;
          document.getElementById('val-actions').textContent = actionCount;
          if (activeCardId) {
            finishOpCard(activeCardId, e.success, e.durationMs);
            activeCardId = null;
          } else {
            // Fallback if event order was weird
            const id = Date.now();
            createOpCard(id, e.action, {});
            finishOpCard(id, e.success, e.durationMs);
          }
          
          if (e.result && e.success) {
            try {
              const resObj = JSON.parse(e.result);
              const lang = (e.action === "run_sql" || e.action === "add_index") ? "json" : "typescript";
              renderCode(JSON.stringify(resObj, null, 2), lang, "output.json");
            } catch { }
          }
          break;

        case "call_ended":
          if (timerInterval) clearInterval(timerInterval);
          setState("ended");
          break;
      }
    }

    function connect() {
      const evtSource = new EventSource(SSE_URL);
      evtSource.onmessage = (e) => {
        try { handleEvent(JSON.parse(e.data)); } catch { }
      };
      evtSource.onerror = () => {
        evtSource.close();
        setTimeout(connect, 3000);
      };
    }

    connect();

    // ----- DEMO MODE (For Testing visual UI locally) -----
    window.runDemo = () => {
      handleEvent({type: "call_started", callSid: "CA1234567890"});
      setTimeout(() => handleEvent({type: "transcript", role: "user", text: "Hey, can you pull the last 5 records from the users table?"}), 2000);
      setTimeout(() => handleEvent({type: "transcript", role: "agent", text: "Sure thing, querying the users table now."}), 4000);
      setTimeout(() => handleEvent({type: "action_proposed", action: "run_sql", params: {}, diff: "SELECT * FROM users\nORDER BY created_at DESC\nLIMIT 5;"}), 5000);
      setTimeout(() => handleEvent({type: "action_done", action: "run_sql", success: true, durationMs: 142, result: JSON.stringify([{id:1, name:"Alice"}, {id:2, name:"Bob"}])}), 6500);
      setTimeout(() => handleEvent({type: "transcript", role: "agent", text: "I found 2 recent users. Would you like me to do anything else?"}), 8000);
    };
  </script>
</body>
</html>
